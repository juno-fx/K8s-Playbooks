---
- name: Bootstrap a single control plane node
  hosts: chroot_targets
  connection: chroot
  vars:
    k3s_install_script_url: "file:///install_files/k3s_install.sh"
    k3s_binary_url: "file:///install_files/k3s"
    juno_bootstrap_url: "file:///install_files/Juno-Bootstrap"
    k3s_bootstrap_node: true
    k3s_control_plane_node: true
  tasks:
    - name: Copy in the chart values file
      ansible.builtin.copy:
        src: /tmp/juno_bootstrap_chart_values.yaml
        dest: /tmp/juno_bootstrap_chart_values.yaml
        mode: '0644'

    - name: Load the chart values from the file
      ansible.builtin.set_fact:
        juno_bootstrap_chart_values: "{{ lookup('file', '/tmp/juno_bootstrap_chart_values.yaml') | from_yaml }}"

    - name: Check the genesis config is present
      ansible.builtin.assert:
        that:
          - juno_bootstrap_chart_values.genesis.config.http_scheme is defined
        fail_msg: "genesis.config.http_scheme is missing from the chart values file"

    - name: Build the genesis connection facts
      ansible.builtin.set_fact:
        genesis_scheme: "{{ juno_bootstrap_chart_values.genesis.config.http_scheme }}"
        genesis_host: "{{ juno_bootstrap_chart_values.genesis.config.host | default('127.0.0.1') }}"

    - name: Build the genesis URL
      ansible.builtin.set_fact:
        genesis_url: "{{ genesis_scheme }}://{{ genesis_host }}"

    - name: If _oneclick_registries is set, populate k3s_registries_yaml with it
      ansible.builtin.set_fact:
        k3s_registries_yaml: "{{ juno_bootstrap_chart_values._oneclick_registries }}"
      when: juno_bootstrap_chart_values._oneclick_registries is defined

    - name: Bootstrap the cluster
      ansible.builtin.include_role:
        name: "juno-fx.juno_k3s"

    - name: Awaiting genesis
      ansible.builtin.debug:
        msg: >
          Waiting for genesis to be reachable at {{ genesis_url }}.
          This can take a while, as images are getting ingested.

    - name: Waiting for genesis to be reachable over http(s)
      ansible.builtin.uri:
        url: "{{ genesis_scheme }}://127.0.0.1"
        headers:
          Host: "{{ genesis_host }}"
        validate_certs: false
        status_code: 200
      register: genesis_health_check
      until: genesis_health_check.status == 200
      retries: 20
      delay: 15
      failed_when: false

    - name: If genesis is not reachable, give a clear error
      ansible.builtin.fail:
        msg: >
          Genesis is not reachable at {{ genesis_url }}.
          Please check your configuration. Is genesis.host a resolvable hostname or IP address?
          Request details: {{ genesis_health_check }}.
      when: genesis_health_check.status != 200

    - name: Display the genesis URL on health check success
      ansible.builtin.debug:
        msg: "Genesis is reachable at {{ genesis_url }}"
      when: genesis_health_check.status == 200